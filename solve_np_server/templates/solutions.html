<!DOCTYPE html>
<html lang="en">
  {{ head | safe }}
  <body>
    {{ header | safe }}
    {% for problem in problems %}
      <div class="data-display-card">
        <h2><a href="/problems/{{ problem.id }}">{{ problem.name }}</a></h2>
        {{ problem.solution_table | safe }}
      </div>
    {% endfor %}
  </body>
</html>
