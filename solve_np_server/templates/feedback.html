<!DOCTYPE html>
<html lang="en">
  {{ head | safe }}
  <body>
    {% match status %}
    {% when Some(Ok(())) %}
    <div class="popup" id="feedback-popup"><p>Feedback sent. Thank you!</p></div>
    {% when Some(Err(msg)) %}
    <div class="popup" id="feedback-popup"><p>Failed to send feedback: {{ msg }}</p></div>
    {% when _ %}
    {% endmatch %}
    <script>
      setTimeout(function() {
        var popup = document.getElementById('feedback-popup');
        if (popup) {
          popup.style.display = 'none';
        }
      }, 5000);
    </script>
    {{ header | safe }}
    <main>
      <article>
        <h2>Send feedback to solveNP</h2>
        <form action="/api/feedback" method="post" class="feedback-form">
          <p><input type="text" id="title" name="title" required placeholder="Title" value="{{ title }}"></p>
          <p><textarea id="content" name="content" required rows="10" placeholder="Feedback">{{ content }}</textarea></p>
          <p><input type="email" id="email" name="email" placeholder="Email (optional)"></p>
          <p><input type="submit" value="Send"></p>
        </form>
      </article>
    </main>
  </body>
</html>
