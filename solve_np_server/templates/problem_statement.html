<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ problem.name }} - solve.NP</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/favicon.png">
    <script src="/js_utils/problem_utils.js"></script>
  </head>
  <body>
    {{ header | safe }}
    <div>
      <article>
        {{ problem.problem_statement | safe }}
        <hr>
        <h2><em>Sample input</em></h2> 
        <pre><code>{{ problem.sample_input }}</code></pre>
        <textarea id="sample_solution" placeholder="Try your solution..." oninput="check_solution('{{ problem.id }}')"></textarea>
        <p id="sample_solution_result"></p>
        <hr>
        <h2><em>Inputs</em></h2>
        {% for input in problem.inputs %}
        <h2><a href="/api/problems/{{ problem.id }}/inputs/{{ input.filename }}" target="_ablank">{{ input.filename }}</a> {{ input.size_h }}{% if header.logged_in %} <a href="/solutions/{{ problem.id }}/{{ input.id }}">[Submit solution]</a>{% endif %}</h2>
        {% endfor %}
      </article>
    </div>
  </body>
</html>
