<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Problems - solve.NP</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    {{ header | safe }}
    <div>
      <article id="problem_statement">
        <script src="/problems/assets/problem_utils.js"></script>
        <script>
          fetch('http://{{ address }}:6520/api/problems/{{ problem_id }}')
            .then(response => response.json())
            .then(problem_details => {
              document.title = `${problem_details.name} - solve.NP`;
              return problem_details.problem_statement_html;
            })
            .then(content => document.getElementById("problem_statement").innerHTML = content)
            .catch(console.log);
        </script>
      </article>
    </div>
  </body>
</html>
