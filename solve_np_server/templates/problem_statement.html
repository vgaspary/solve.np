<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Problems - solve.NP</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/favicon.png">
    <script src="/js_utils/problem_utils.js"></script>
  </head>
  <body>
    {{ header | safe }}
    <div>
      <article id="problem_statement">
        <script>
          fetch('/api/problems/{{ problem_id }}')
            .then(response => response.json())
            .then(problem_details => {
              document.title = `${problem_details.name} - solve.NP`;
              document.getElementById("problem_statement").innerHTML = problem_details.problem_statement_html;
            })
            .catch(console.log);
        </script>
      </article>
      <article>
        <hr>
        <h2><em>Sample input</em></h2> 
        <pre><code>{{ sample_input }}</code></pre>
        <textarea id="sample_solution" placeholder="Try your solution..." oninput="check_solution('{{ problem_id }}')"></textarea>
        <p id="sample_solution_result"></p>
      </article>
    </div>
  </body>
</html>
