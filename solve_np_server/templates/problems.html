<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Problems - solve.NP</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/favicon.png">
  </head>
  <body>
    {{ header | safe }}
    <div>
      <ul>
        {% for problem in problems %}
        <li>
          <h1><a href="/problems/{{problem.id}}">{{problem.name}}</a></h1>
          <article><p>{{problem.description}}</p></article>
        </li>
        {% endfor %}
      </ul>
    </div>
  </body>
</html>
