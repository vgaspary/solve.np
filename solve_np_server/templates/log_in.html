<!DOCTYPE html>
<html lang="en">
  {{ head | safe }}
  <body>
    {{ header | safe }}
    {% if test_auth %}
    <div>
      <form action="/api/log_in{% if let Some(url) = redirect %}?redirect={{ url }}{% endif %}" method="post">
        <label for="username">Username:</label><br>
        <input type="text" name="username" required><br>
        <br>
        <label for="password">Password:</label><br>
        <input type="password" name="password" required><br>
        <br>
        <p style="color:red">{{ error_msg }}</p>
        <input type="submit" value="Log In">
      </form>
    </div>
    {% else %}
    <div>
      Log in with <a href="/api/log_in/google">[Google]</a> or <a>[GitHub]</a>.
    </div>
    {% endif %}
  </body>
</html>
