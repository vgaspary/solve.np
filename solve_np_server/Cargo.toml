[package]
name = "solve_np_server"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-files = "0.6.6"
actix-session = { version = "0.11.0", features = ["cookie-session"] }
actix-web = { version = "4.10.2", features = ["rustls-0_23"] }
anyhow = "1.0.100"
askama = "0.14.0"
base64 = "0.22.1"
clap = { version = "4.5.37", features = ["derive"] }
env_logger = "0.11.8"
graph_coloring_validate = { path = "../problems/graph_coloring/graph_coloring_validate" }
humantime = "2.3.0"
itertools = "0.14.0"
jsonwebtoken = "9.3.0"
lettre = { version = "0.11.19", features = ["tokio1-native-tls"] }
libgraph = { path = "../libgraph" }
librank = { path = "../librank" }
log = "0.4.27"
maximum_clique_validate = { path = "../problems/maximum_clique/maximum_clique_validate" }
nix = { version = "0.30.1", features = ["signal", "process"] }
once_cell = "1.19.0"
percent-encoding = "2.3.2"
pulldown-cmark = "0.13.0"
rand = "0.9.2"
reqwest = { version = "0.12.5", default-features = false, features = ["json", "cookies", "rustls-tls"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
rustls = { version = "0.23.35", default-features = false, features = ["ring"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.219", features = ["derive", "serde_derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
sha256 = "1.6.0"
tokio = { version = "1", features = ["full"] }
tsp_validate = { path = "../problems/travelling_salesman/tsp_validate" }
uuid = { version = "1.18.1", features = ["v4"] }
vertex_cover_validate = { path = "../problems/vertex_cover/vertex_cover_validate" }

[dev-dependencies]
regex = "1.10.5"
nix = "0.30.1"
